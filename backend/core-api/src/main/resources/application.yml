server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: medinteract-core-api

  # Conexão com o banco PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medinteract}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  # Cria/atualiza automaticamente as tabelas mapeadas pelas classes @Entity
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

medinteract:
  # Endereço do motor de IA em Python (FastAPI)
  ai-engine:
    url: ${AI_ENGINE_URL:http://localhost:5000}

logging:
  level:
    root: INFO
    com.medinteract.coreapi: DEBUG
